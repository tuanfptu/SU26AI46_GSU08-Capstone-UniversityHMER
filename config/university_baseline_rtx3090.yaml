seed: 7
pretrained_checkpoint: lightning_logs/version_3/checkpoints/epoch=55-step=175503-val_ExpRate=0.6954.ckpt
output_dir: outputs/university_baseline_rtx3090
auto_calibrate_hme_baseline: true

wandb:
  enabled: true
  project: University-TAMER
  entity: null
  name: v3-fusion-mathwriting10k-hme40-seed7
  id: university-tamer-v3-fusion-seed7
  resume: allow
  save_dir: outputs/university_baseline_rtx3090
  log_model: false

performance:
  allow_tf32: true
  float32_matmul_precision: high

trainer:
  gpus: 1
  max_epochs: 20
  accumulate_grad_batches: 2
  gradient_clip_val: 5.0
  precision: 16
