seed: 7
pretrained_checkpoint: outputs/phase1_a0_control_seed7/checkpoints/epoch=14-val_university_ExpRate=0.4040.ckpt
output_dir: outputs/real_ft_a0_control_seed7
auto_calibrate_hme_baseline: false

selection:
  monitor: val_university_ExpRate
  mode: max
  save_top_k: 3

wandb:
  enabled: true
  project: University-TAMER-RealFT
  name: real-ft-a0-control-seed7
  id: real-ft-a0-control-seed7

performance:
  allow_tf32: true
  float32_matmul_precision: high

trainer:
  gpus: 1
  max_epochs: 100
  accumulate_grad_batches: 2
  gradient_clip_val: 5.0
  precision: 16
  deterministic: warn
  benchmark: false
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  early_stopping_patience: 6
  early_stopping_min_delta: 0.001

model_overrides:
  use_fusion: true
  use_encoder_adapter: false
  use_decoder_adapter: false
  adapter_bottleneck_dim: 64
  adapter_dropout: 0.10
  adapter_gate_init_bias: -2.0
  learning_rate: 0.00001
  patience: 6
  weight_decay: 0.0001
  freeze_encoder_epochs: 1
  hme_baseline_exprate: 0.793666660785675
  max_hme_drop: 0.10
  retention_penalty: 0.0
  beam_size: 10
  prediction_output_dir: outputs/real_ft_a0_control_seed7/predictions

data:
  dictionary: data/HME100k/dictionary.txt
  university_train_manifest: data/real/real_classroom_dataset_manual_removed/real_train.csv
  university_val_manifest: data/real/real_classroom_dataset_manual_removed/real_validation.csv
  hme_replay_manifest: data/hme_cache/replay.csv
  hme_val_manifest: data/hme_cache/validation.csv
  university_data_root: data/real/real_classroom_dataset_manual_removed
  hme_cache_root: data/hme_cache
  background_dir: data/paper_backgrounds_processed/train
  train_batch_size: 8
  eval_batch_size: 2
  replay_ratio: 0.0
  dynamic_augmentation: true
  enable_hme_validation: false
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  seed: 7
